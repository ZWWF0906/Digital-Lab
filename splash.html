<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalLab</title>
<style>
  /* ── 本地字体：Orbitron（字标用）─────────────────────────────────────────
     与主应用同一份文件：build/fonts/orbitron-latin-wght-normal.woff2
     来源 @fontsource-variable/orbitron v5.3.0（OFL-1.1），
     版权 Copyright 2018 The Orbitron Project Authors。仅覆盖拉丁字符。 */
  @font-face {
    font-family: 'Orbitron';
    font-style: normal;
    font-weight: 400 900;
    font-display: swap;
    src: url('build/fonts/orbitron-latin-wght-normal.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
      U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
      U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    --bg: #0F1E28;                       /* 深蓝底 */
    --accent: #2EE6B3;                   /* 翡翠绿：六边形边框与波形 */
    --text: #E0E6ED;                     /* 字标 */
    --dim: rgba(224, 230, 237, 0.55);    /* 次要文字 */
    --panel-border: rgba(46, 230, 179, 0.28);  /* 自检区虚线边框（半透明翡翠绿） */
    --panel-bg: rgba(255, 255, 255, 0.02);
    --skeleton: rgba(46, 230, 179, 0.16);      /* 骨架线 */
    --skeleton-dot: rgba(46, 230, 179, 0.45);
    --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);  /* 徽章描边/波形：expo-out 强减速 */
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 整屏纵向居中；所有尺寸用 clamp()，窗口变小不溢出 */
  .splash {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vmin, 32px);
    padding: clamp(10px, 3.5vmin, 44px);
  }

  /* 图形区：约 200×200，viewBox 已裁掉图标自带的 80% 留白 */
  .mark {
    width: clamp(104px, 26vmin, 200px);
    aspect-ratio: 460 / 400;
  }
  .mark svg { display: block; width: 100%; height: 100%; }

  /* 字标 */
  .wordmark {
    font-family: 'Orbitron', system-ui, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 4.2vmin, 34px);
    letter-spacing: 0.14em;
    text-indent: 0.14em;         /* 抵消末字符字距，保持视觉居中 */
    color: var(--text);
    line-height: 1.1;
  }

  /* 自检区（预留）：固定尺寸面板 + 虚线边框 + 静态骨架线 */
  .checks {
    width: min(520px, 92vw);
    height: clamp(120px, 24vmin, 190px);
    border: 1px dashed var(--panel-border);
    border-radius: 16px;
    background: var(--panel-bg);
    padding: clamp(14px, 2.2vmin, 22px);
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.6vmin, 14px);
  }

  .checks-title {
    font-size: clamp(11px, 1.4vmin, 12.5px);
    letter-spacing: 0.1em;
    color: var(--dim);
  }

  .checks-list {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.6vmin, 14px);
  }

  /* 骨架线：纯静态，无任何动画/过渡 */
  .row { display: flex; align-items: center; gap: 10px; }
  .row::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--skeleton-dot);
    flex: none;
  }
  .bar {
    height: 8px;
    border-radius: 999px;
    background: var(--skeleton);
  }
  .row:nth-child(1) .bar { width: 62%; }
  .row:nth-child(2) .bar { width: 78%; }
  .row:nth-child(3) .bar { width: 48%; }
  .row:nth-child(4) .bar { width: 70%; }

  /* ── 入场动画（纯 CSS，总时长 3.0s）──────────────────────────────────────
     0.2s 六边形描边生长 1.2s，expo-out 强减速（→ 1.4s）
     1.2s 波形自左流入 0.9s，同样 expo-out（→ 2.1s）
     2.0s 字标逐字浮出，每个 0.4s、间隔 60ms、匀速 linear（最后一个 2.54s 开始、2.94s 结束）
     2.6s 自检区淡入 0.4s ease-out（→ 3.0s）
     徽章（六边形/波形）用 cubic-bezier(0.16, 1, 0.3, 1)：起步快、后段明显慢下来；
     字标用 linear 保持逐字节奏均匀。
     全部用 animation（不用 transition）；
     初始隐藏交给 keyframes 的 from 配合 fill-mode: both，
     因此 prefers-reduced-motion 下只要 animation: none 就自然呈现终态。 */
  @keyframes hexDraw  { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes waveDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes letterIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes checksIn { from { opacity: 0; } to { opacity: 1; } }

  /* 两条 path 都带 pathLength="1"，长度归一化为 1，dash 单位即整条路径 */
  .hex  { stroke-dasharray: 1; stroke-dashoffset: 1; animation: hexDraw 1.2s var(--ease-expo) 0.2s both; }
  .wave { stroke-dasharray: 1; stroke-dashoffset: 1; animation: waveDraw 0.9s var(--ease-expo) 1.2s both; }

  .wordmark span { display: inline-block; animation: letterIn 0.4s linear both; }
  .wordmark span:nth-child(1)  { animation-delay: 2.00s; }
  .wordmark span:nth-child(2)  { animation-delay: 2.06s; }
  .wordmark span:nth-child(3)  { animation-delay: 2.12s; }
  .wordmark span:nth-child(4)  { animation-delay: 2.18s; }
  .wordmark span:nth-child(5)  { animation-delay: 2.24s; }
  .wordmark span:nth-child(6)  { animation-delay: 2.30s; }
  .wordmark span:nth-child(7)  { animation-delay: 2.36s; }
  .wordmark span:nth-child(8)  { animation-delay: 2.42s; }
  .wordmark span:nth-child(9)  { animation-delay: 2.48s; }
  .wordmark span:nth-child(10) { animation-delay: 2.54s; }

  .checks { animation: checksIn 0.4s ease-out 2.6s both; }

  /* 系统开启"减少动态效果"时不播动画，直接显示终态 */
  @media (prefers-reduced-motion: reduce) {
    .hex, .wave, .wordmark span, .checks { animation: none; }
    .hex, .wave { stroke-dashoffset: 0; }   /* 终态：描边完整可见 */
  }
</style>
</head>
<body>
  <main class="splash">

    <!-- 图形：正六边形（左右尖角）+ QRS 波形，B 变体几何；
         原图标画布 512×512、六边形外接框 458×398（含 10px 描边），
         这里 viewBox 取 460×400 裁掉四周留白，波形线宽 15、边框线宽 10 按比例缩放。 -->
    <div class="mark" role="img" aria-label="DigitalLab 图标">
      <svg viewBox="26 56 460 400" xmlns="http://www.w3.org/2000/svg">
        <path class="hex" pathLength="1"
              d="M 480.00 256.00 L 368.00 449.99 L 144.00 449.99 L 32.00 256.00 L 144.00 62.01 L 368.00 62.01 Z"
              fill="#0F1E28" stroke="#2EE6B3" stroke-width="10" stroke-linejoin="round"/>
        <path class="wave" pathLength="1"
              d="M 108.00 256.00 L 196.80 256.00 L 249.00 118.00 L 263.00 406.00 L 315.20 256.00 L 404.00 256.00"
              fill="none" stroke="#2EE6B3" stroke-width="15"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- 字标：拆成单字母 span，逐个用 animation-delay 错开（纯 CSS，无脚本） -->
    <div class="wordmark" aria-label="DigitalLab"><span>D</span><span>i</span><span>g</span><span>i</span><span>t</span><span>a</span><span>l</span><span>L</span><span>a</span><span>b</span></div>

    <!-- 自检区（预留） -->
    <section class="checks">
      <div class="checks-title">自检项区域（预留）</div>
      <div class="checks-list">
        <div class="row"><span class="bar"></span></div>
        <div class="row"><span class="bar"></span></div>
        <div class="row"><span class="bar"></span></div>
        <div class="row"><span class="bar"></span></div>
      </div>
    </section>

  </main>
</body>
</html>
