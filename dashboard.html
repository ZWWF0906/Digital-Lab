<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalLab</title>
<script>
  // 主题初始化：在样式渲染前应用，深色为默认。
  // 权威源是应用级 config.json 的 theme（启动期一次 sendSync）；localStorage 只作快速缓存，
  // 两者不一致时以 config.json 为准并回写缓存（强制结束进程会让 localStorage 丢写，config.json 不会）。
  (function () {
    var t = 'dark';
    try { t = localStorage.getItem('digitallab-theme') || 'dark'; } catch (e) {}
    if (t !== 'light') t = 'dark';
    try {
      var api = window.digitalLab;
      if (api && typeof api.getThemeSync === 'function') {
        var t2 = api.getThemeSync();
        if (t2 === 'light' || t2 === 'dark') {
          if (t2 !== t) { try { localStorage.setItem('digitallab-theme', t2); } catch (e) {} }
          t = t2;
        }
      }
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<script src="locales/index.js"></script>
<script src="i18n.js"></script>
<script>
  // 语言初始化：与主题同一位置、同一时机（首帧前完成）。
  // 优先级：config.json（启动期一次 sendSync）→ localStorage 缓存 → 系统语言（locales/index.js 的默认语言函数）。
  (function () {
    try { if (window.DigitalLabLocales && window.DigitalLabLocales.preloadAll) { window.DigitalLabLocales.preloadAll(); } } catch (e) {}
    var lang = null;
    try {
      var api = window.digitalLab;
      if (api && typeof api.getLanguageSync === 'function') { lang = api.getLanguageSync(); }
    } catch (e) {}
    if (!lang) { try { lang = localStorage.getItem('digitallab-lang'); } catch (e) {} }
    if (!lang && window.DigitalLabLocales) { lang = window.DigitalLabLocales.getDefaultLanguage(); }
    var ok = false;
    try { ok = !!(window.DigitalLabI18n && window.DigitalLabI18n.setLanguage(lang)); } catch (e) {}
    if (!ok && window.DigitalLabI18n) { lang = window.DigitalLabI18n.getLanguage(); }
    try { localStorage.setItem('digitallab-lang', lang); } catch (e) {}
    document.documentElement.setAttribute('lang', lang);
  })();
</script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css">
<style>
  /* ── 启动开屏覆盖层：几何/配色/动画时序沿用开屏设计，样式全部限定在 #boot-splash 内 ── */
  #boot-splash {
    /* 覆盖层设计令牌（design-system 的"组件层 token"，取值沿用图标配色，便于统一调整） */
    --bs-bg: #0F1E28;
    --bs-accent: #2EE6B3;
    --bs-accent-hi: #A8F5DA;
    --bs-text: #E0E6ED;
    --bs-dim: rgba(224, 230, 237, 0.55);
    --bs-dur-micro: 0.3s;
    --bs-dur-base: 0.5s;
    --bs-ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
    /* 组件层令牌：把原先散在各处的硬编码色收进来，浅色主题只覆盖这些值 */
    --bs-glow-core: rgba(46, 230, 179, 0.13);
    --bs-glow-mid: rgba(46, 230, 179, 0.05);
    --bs-glow-fade: rgba(15, 30, 40, 0);
    --bs-glow-opacity: 1;
    --bs-grid: rgba(168, 245, 218, 0.05);
    --bs-grid-opacity: 0.5;
    --bs-panel-bg: rgba(255, 255, 255, 0.02);
    --bs-panel-border: rgba(46, 230, 179, 0.28);
    --bs-dim-strong: rgba(224, 230, 237, 0.85);
    --bs-dim-soft: rgba(224, 230, 237, 0.35);
    --bs-dim-faint: rgba(224, 230, 237, 0.18);
    --bs-dim-text: rgba(224, 230, 237, 0.45);
    --bs-accent-glow: rgba(46, 230, 179, 0.55);
    --bs-fail: #f43f5e;
    --bs-fail-glow: rgba(244, 63, 94, 0.5);
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vmin, 32px);
    padding: clamp(10px, 3.5vmin, 44px);
    background: var(--bs-bg);
    color: var(--bs-text);
    font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* 浅色主题：整体浅底 + 深绿描边，取值对齐 styles.css 的 :root[data-theme="light"]。
     主题在 <head> 的脚本里同步写进 data-theme，所以开屏渲染时这里已经生效，不会先深后浅。 */
  :root[data-theme="light"] #boot-splash {
    --bs-bg: #F2F5F8;
    --bs-accent: #059669;
    --bs-accent-hi: #34D399;
    --bs-text: #1E293B;
    --bs-dim: rgba(30, 41, 59, 0.55);
    /* 浅色下径向辉光与点阵底纹都调淡，避免白底显脏 */
    --bs-glow-core: rgba(5, 150, 105, 0.10);
    --bs-glow-mid: rgba(5, 150, 105, 0.035);
    --bs-glow-fade: rgba(242, 245, 248, 0);
    --bs-glow-opacity: 0.55;
    --bs-grid: rgba(5, 150, 105, 0.045);
    --bs-grid-opacity: 0.28;
    --bs-panel-bg: rgba(30, 41, 59, 0.02);
    --bs-panel-border: rgba(5, 150, 105, 0.28);
    --bs-dim-strong: rgba(30, 41, 59, 0.85);
    --bs-dim-soft: rgba(30, 41, 59, 0.35);
    --bs-dim-faint: rgba(30, 41, 59, 0.15);
    --bs-dim-text: rgba(30, 41, 59, 0.5);
    --bs-accent-glow: rgba(5, 150, 105, 0.45);
    --bs-fail: #dc2626;
    --bs-fail-glow: rgba(220, 38, 38, 0.45);
  }
  /* 收尾呼吸：与"全部展示完"后的 400ms 停留同步，随后才淡出。
     注意顺序：.is-breath 必须写在 .is-out 前面——两条选择器权重相同（#id+.class），
     同时挂在这一个元素上时后写的生效，写在后面会把淡出动画顶掉（曾用 animationend 取证发现）。 */
  #boot-splash.is-breath { animation: bs-breath 0.4s ease-in-out; }
  #boot-splash.is-out { animation: bs-splashOut 0.4s ease-out forwards; pointer-events: none; }

  /* 背景层次：径向辉光（随六边形一起亮起）+ 极淡点阵底纹（缓慢流动） */
  #boot-splash::before,
  #boot-splash::after { content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none; }
  #boot-splash::before {
    background: radial-gradient(circle at 50% 44%,
      var(--bs-glow-core) 0%, var(--bs-glow-mid) 32%, var(--bs-glow-fade) 62%);
    animation: bs-glowIn 1.1s ease-out 0.15s both;
  }
  #boot-splash::after {
    background-image: radial-gradient(var(--bs-grid) 1px, transparent 1px);
    background-size: 22px 22px;
    opacity: var(--bs-grid-opacity);
    animation: bs-drift 18s linear infinite;
  }
  #boot-splash .bs-mark,
  #boot-splash .bs-wordmark,
  #boot-splash .bs-checks { position: relative; z-index: 1; }

  #boot-splash .bs-mark { width: clamp(104px, 26vmin, 200px); aspect-ratio: 460 / 400; }
  #boot-splash .bs-mark svg { display: block; width: 100%; height: 100%; }

  #boot-splash .bs-wordmark {
    font-family: 'Orbitron', system-ui, 'Segoe UI', sans-serif;
    font-weight: 700;
    font-size: clamp(20px, 4.2vmin, 34px);
    letter-spacing: 0.14em;
    text-indent: 0.14em;
    line-height: 1.1;
    color: var(--bs-text);
  }
  #boot-splash .bs-wordmark span { display: inline-block; animation: bs-letterIn 0.4s linear both; }
  #boot-splash .bs-wordmark span:nth-child(1)  { animation-delay: 2.00s; }
  #boot-splash .bs-wordmark span:nth-child(2)  { animation-delay: 2.06s; }
  #boot-splash .bs-wordmark span:nth-child(3)  { animation-delay: 2.12s; }
  #boot-splash .bs-wordmark span:nth-child(4)  { animation-delay: 2.18s; }
  #boot-splash .bs-wordmark span:nth-child(5)  { animation-delay: 2.24s; }
  #boot-splash .bs-wordmark span:nth-child(6)  { animation-delay: 2.30s; }
  #boot-splash .bs-wordmark span:nth-child(7)  { animation-delay: 2.36s; }
  #boot-splash .bs-wordmark span:nth-child(8)  { animation-delay: 2.42s; }
  #boot-splash .bs-wordmark span:nth-child(9)  { animation-delay: 2.48s; }
  #boot-splash .bs-wordmark span:nth-child(10) { animation-delay: 2.54s; }

  #boot-splash .bs-checks {
    width: min(520px, 92vw);
    height: clamp(120px, 24vmin, 190px);
    border: 1px dashed var(--bs-panel-border);
    border-radius: 16px;
    background: var(--bs-panel-bg);
    padding: clamp(14px, 2.2vmin, 22px);
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.3vmin, 12px);
    animation: bs-checksIn 0.4s ease-out 2.6s both;
  }
  #boot-splash .bs-checks-title {
    font-size: clamp(11px, 1.4vmin, 12.5px);
    letter-spacing: 0.1em;
    color: var(--bs-dim);
  }

  /* 自检项：初始隐藏，到点由脚本加 is-shown 才出现（保证逐项点亮） */
  #boot-splash .bs-item {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: clamp(11.5px, 1.5vmin, 13px);
    opacity: 0;
    visibility: hidden;
  }
  #boot-splash .bs-item.is-shown { visibility: visible; animation: bs-rowIn 0.3s ease-out both; }
  #boot-splash .bs-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; position: relative; background: var(--bs-dim-soft); }
  #boot-splash .bs-name { color: var(--bs-dim-strong); }
  #boot-splash .bs-state { margin-left: auto; color: var(--bs-dim); font-variant-numeric: tabular-nums; }
  /* 点亮反馈：状态变化时圆点外扩一圈光晕 + 状态文字轻微位移；通过项持续极轻"呼吸" */
  #boot-splash .bs-dot::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    margin: -50% 0 0 -50%;
    border-radius: 50%;
    border: 1px solid transparent;
    opacity: 0;
  }
  #boot-splash .bs-item.is-pop .bs-dot::after { animation: bs-halo 0.65s var(--bs-ease-soft) forwards; }
  #boot-splash .bs-item.is-pop .bs-state { animation: bs-nudge 0.4s var(--bs-ease-soft); }
  #boot-splash .bs-item.st-pass .bs-dot { animation: bs-breathe 3.2s ease-in-out infinite; }
  #boot-splash .bs-item.st-fail .bs-dot { animation: bs-breathe 3.2s ease-in-out infinite; }
  #boot-splash .bs-item:nth-child(3) .bs-dot { animation-delay: 0.35s; }
  #boot-splash .bs-item:nth-child(4) .bs-dot { animation-delay: 0.7s; }
  #boot-splash .bs-item:nth-child(5) .bs-dot { animation-delay: 1.05s; }
  #boot-splash .bs-item.st-pass .bs-dot::after { border-color: var(--bs-accent); }
  #boot-splash .bs-item.st-fail .bs-dot::after { border-color: var(--bs-fail); }
  #boot-splash .bs-item.st-skip .bs-dot::after { border-color: var(--bs-dim-soft); }

  #boot-splash .bs-item.st-pass .bs-dot { background: var(--bs-accent); box-shadow: 0 0 8px var(--bs-accent-glow); }
  #boot-splash .bs-item.st-pass .bs-state { color: var(--bs-accent); }
  #boot-splash .bs-item.st-fail .bs-dot { background: var(--bs-fail); box-shadow: 0 0 8px var(--bs-fail-glow); }
  #boot-splash .bs-item.st-fail .bs-state { color: var(--bs-fail); }
  #boot-splash .bs-item.st-skip .bs-dot { background: var(--bs-dim-faint); }
  #boot-splash .bs-item.st-skip .bs-state { color: var(--bs-dim-text); }

  /* SVG 描边/填充：markup 里是表现属性（stroke="#2EE6B3" 等），CSS 规则优先级高于表现属性，
     所以在这里用令牌统一覆盖，浅色主题不用改 markup 就能换成深绿。 */
  #boot-splash .bs-hex-glow,
  #boot-splash .bs-wave-glow,
  #boot-splash .bs-wave { stroke: var(--bs-accent); }
  #boot-splash .bs-hex { fill: var(--bs-bg); stroke: var(--bs-accent); }
  #boot-splash .bs-hex-streak { stroke: var(--bs-accent-hi); }

  #boot-splash .bs-hex {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: bs-hexDraw 1.2s var(--ease-expo, cubic-bezier(0.16, 1, 0.3, 1)) 0.2s both;
  }
  #boot-splash .bs-wave {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: bs-waveDraw 0.9s var(--ease-expo, cubic-bezier(0.16, 1, 0.3, 1)) 1.2s both;
  }

  /* 辉光副本：与主线同一条路径、同步生长，模糊 + 低不透明度，形成"描边发光" */
  #boot-splash .bs-hex-glow {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    filter: blur(6px);
    animation: bs-hexDraw 1.2s var(--ease-expo, cubic-bezier(0.16, 1, 0.3, 1)) 0.2s both;
  }
  #boot-splash .bs-wave-glow {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    filter: blur(7px);
    animation: bs-waveDraw 0.9s var(--ease-expo, cubic-bezier(0.16, 1, 0.3, 1)) 1.2s both;
  }
  /* 描边流光：一小段更亮的高光沿六边形走一遍（单次、低透明度、轻微模糊） */
  #boot-splash .bs-hex-streak {
    stroke-dasharray: 0.06 0.94;
    stroke-dashoffset: 0;
    opacity: 0;
    filter: blur(2px);
    animation: bs-streak 1.1s linear 1.35s both;
  }

  /* 入场动画初始暂停：等 JS 判定"窗口可见"后给 #boot-splash 加 is-armed 才起跑；
     animation-play-state 从 paused 变 running 时，动画时钟从这一刻重新计时（delay 也重新算），
     所以六边形 0.2s / 波形 1.2s / 字标 2.0s / 面板 2.6s 的时序在起跑后依然正确。 */
  #boot-splash:not(.is-armed) .bs-hex,
  #boot-splash:not(.is-armed) .bs-wave,
  #boot-splash:not(.is-armed) .bs-hex-glow,
  #boot-splash:not(.is-armed) .bs-wave-glow,
  #boot-splash:not(.is-armed) .bs-hex-streak,
  #boot-splash:not(.is-armed)::before,
  #boot-splash:not(.is-armed)::after,
  #boot-splash:not(.is-armed) .bs-wordmark span,
  #boot-splash:not(.is-armed) .bs-checks { animation-play-state: paused; }

  @keyframes bs-hexDraw  { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes bs-waveDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes bs-streak {
    0%   { stroke-dashoffset: 0;   opacity: 0; }
    18%  { opacity: 0.45; }
    82%  { opacity: 0.45; }
    100% { stroke-dashoffset: -1;  opacity: 0; }
  }
  @keyframes bs-glowIn { from { opacity: 0; } to { opacity: var(--bs-glow-opacity, 1); } }
  @keyframes bs-drift { from { background-position: 0 0; } to { background-position: 22px 22px; } }
  @keyframes bs-breath {
    0%   { transform: scale(1);     opacity: 1; }
    55%  { transform: scale(1.006); opacity: 0.97; }
    100% { transform: scale(1);     opacity: 1; }
  }
  @keyframes bs-halo {
    0%   { transform: scale(0.6); opacity: 0; }
    25%  { opacity: 0.55; }
    100% { transform: scale(2.6); opacity: 0; }
  }
  @keyframes bs-nudge { from { transform: translateX(-6px); opacity: 0.3; } to { transform: translateX(0); opacity: 1; } }
  @keyframes bs-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.62; } }
  /* 字标逐字浮出：同时从翡翠绿过渡到终态文字色，形成自左向右的"绿→白"扫过 */
  @keyframes bs-letterIn {
    from { opacity: 0; transform: translateY(8px); color: var(--bs-accent); }
    to   { opacity: 1; transform: translateY(0);   color: var(--bs-text); }
  }
  @keyframes bs-checksIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bs-rowIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes bs-splashOut { from { opacity: 1; } to { opacity: 0; } }

  /* 系统开启"减少动态效果"：直接显示终态，不播动画（稍后由脚本短暂停留再淡出） */
  @media (prefers-reduced-motion: reduce) {
    #boot-splash .bs-hex, #boot-splash .bs-wave, #boot-splash .bs-wordmark span,
    #boot-splash .bs-checks, #boot-splash .bs-item, #boot-splash.is-out,
    #boot-splash.is-breath, #boot-splash::before, #boot-splash::after,
    #boot-splash .bs-hex-glow, #boot-splash .bs-wave-glow, #boot-splash .bs-hex-streak,
    #boot-splash .bs-dot, #boot-splash .bs-item.is-pop .bs-dot::after,
    #boot-splash .bs-item.is-pop .bs-state { animation: none; }
    #boot-splash .bs-hex, #boot-splash .bs-wave { stroke-dashoffset: 0; }
    /* 装饰层在减少动态效果时不出现（保留静态径向辉光与点阵底纹） */
    #boot-splash .bs-hex-glow, #boot-splash .bs-wave-glow, #boot-splash .bs-hex-streak { opacity: 0; }
    #boot-splash::before { opacity: var(--bs-glow-opacity, 1); }
    #boot-splash::after { opacity: var(--bs-grid-opacity, 0.5); }
    #boot-splash .bs-item { opacity: 1; visibility: visible; }
    #boot-splash.is-out { opacity: 0; }
    /* 减少动态效果时同样等"可见判定"后才显示终态，不提前露出 */
    #boot-splash:not(.is-armed) .bs-mark,
    #boot-splash:not(.is-armed) .bs-wordmark,
    #boot-splash:not(.is-armed) .bs-checks,
    #boot-splash:not(.is-armed) .bs-item { opacity: 0; visibility: hidden; }
  }

  /* ── 首次启动引导覆盖层：样式全部限定在 #onboarding 内，层级高于 #boot-splash ──
     不使用 styles.css，也不影响其它面板；未加 .is-open 时完全不参与布局（display:none）。 */
  #onboarding {
    position: fixed;
    inset: 0;
    z-index: 40;                 /* #boot-splash 是 30，引导必须盖住它 */
    display: none;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vmin, 32px);
    background: rgba(8, 14, 20, 0.82);
    backdrop-filter: blur(3px);
    color: #E0E6ED;
    font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei UI', sans-serif;
  }
  #onboarding.is-open { display: flex; }
  #onboarding *, #onboarding *::before, #onboarding *::after { box-sizing: border-box; }
  #onboarding .ob-card {
    width: min(560px, 96vw);
    max-height: 92vh;
    overflow: auto;
    background: #0F1E28;
    border: 1px solid rgba(46, 230, 179, 0.28);
    border-radius: 16px;
    padding: clamp(18px, 3vmin, 28px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }
  #onboarding .ob-title { font-size: 1.25rem; font-weight: 600; color: #E0E6ED; }
  #onboarding .ob-sub { margin-top: 6px; font-size: 0.82rem; color: rgba(224, 230, 237, 0.6); }
  #onboarding .ob-steps { display: flex; gap: 8px; margin: 18px 0 16px; flex-wrap: wrap; }
  #onboarding .ob-chip {
    font-size: 0.74rem;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(45, 212, 191, 0.25);
    color: rgba(224, 230, 237, 0.55);
  }
  #onboarding .ob-chip.is-active { border-color: #2EE6B3; color: #2EE6B3; }
  #onboarding .ob-chip.is-done { border-color: rgba(46, 230, 179, 0.5); color: rgba(46, 230, 179, 0.75); }
  #onboarding .ob-pane { display: none; }
  #onboarding .ob-pane.is-active { display: block; }
  #onboarding .ob-pane-title { font-size: 0.98rem; font-weight: 600; margin-bottom: 6px; }
  #onboarding .ob-pane-hint { font-size: 0.78rem; color: rgba(224, 230, 237, 0.55); line-height: 1.6; margin-bottom: 14px; }
  #onboarding .ob-langs { display: flex; flex-direction: column; gap: 8px; }
  #onboarding .ob-lang {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(224, 230, 237, 0.16);
    background: rgba(255, 255, 255, 0.02);
    color: #E0E6ED;
    font-size: 0.9rem;
    cursor: pointer;
    text-align: left;
  }
  #onboarding .ob-lang:hover { border-color: rgba(46, 230, 179, 0.45); }
  #onboarding .ob-lang.is-active { border-color: #2EE6B3; background: rgba(46, 230, 179, 0.08); }
  #onboarding .ob-lang .ob-lang-tick { color: #2EE6B3; }
  #onboarding .ob-form { display: flex; flex-direction: column; gap: 10px; }
  #onboarding .ob-row { display: flex; align-items: center; gap: 10px; }
  #onboarding .ob-row > label { width: 96px; flex: none; font-size: 0.82rem; color: rgba(224, 230, 237, 0.7); }
  #onboarding .ob-row > input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(224, 230, 237, 0.18);
    background: rgba(255, 255, 255, 0.03);
    color: #E0E6ED;
    font-size: 0.85rem;
    font-family: inherit;
  }
  #onboarding .ob-row > input:focus { outline: none; border-color: #2EE6B3; }
  #onboarding .ob-msg { margin-top: 10px; font-size: 0.78rem; line-height: 1.6; min-height: 18px; color: rgba(224, 230, 237, 0.6); }
  #onboarding .ob-msg.is-error { color: #f43f5e; }
  #onboarding .ob-msg.is-ok { color: #2EE6B3; }
  #onboarding .ob-status { font-size: 0.85rem; line-height: 1.7; }
  #onboarding .ob-status .ob-status-line { display: flex; gap: 8px; align-items: baseline; }
  #onboarding .ob-status .ob-status-dot { color: rgba(224, 230, 237, 0.45); }
  #onboarding .ob-status .ob-status-dot.is-ok { color: #2EE6B3; }
  #onboarding .ob-status .ob-status-dot.is-fail { color: #f43f5e; }
  #onboarding .ob-detail { font-size: 0.75rem; color: rgba(224, 230, 237, 0.5); word-break: break-all; margin: 2px 0 8px 16px; }
  #onboarding .ob-later { margin-top: 14px; }
  #onboarding .ob-foot { display: flex; align-items: center; gap: 8px; margin-top: 20px; }
  #onboarding .ob-spacer { flex: 1; }
  #onboarding .ob-btn {
    padding: 8px 16px;
    border-radius: 9px;
    font-size: 0.84rem;
    cursor: pointer;
    border: 1px solid transparent;
    font-family: inherit;
  }
  #onboarding .ob-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  #onboarding .ob-primary { background: #2EE6B3; color: #06231b; font-weight: 600; }
  #onboarding .ob-secondary { background: rgba(255, 255, 255, 0.04); color: #E0E6ED; border-color: rgba(224, 230, 237, 0.22); }
  #onboarding .ob-ghost { background: transparent; color: rgba(224, 230, 237, 0.7); border-color: transparent; text-decoration: underline; text-underline-offset: 3px; }
  #onboarding .ob-ghost:hover { color: #E0E6ED; }
  /* 浅色主题下引导卡片仍保持深色（与终端面板同理），只调整遮罩透明度 */
  :root[data-theme="light"] #onboarding { background: rgba(15, 20, 25, 0.55); }
  @media (prefers-reduced-motion: reduce) {
    #onboarding .ob-btn, #onboarding .ob-lang { transition: none; }
  }
</style>
</head>
<body>
  <!-- ── 启动开屏覆盖层：图形/字标沿用开屏设计；自检 4 项由真实状态驱动，按 2.6/3.0/3.4/3.8s 逐项点亮 ── -->
  <!-- 文案一律走 i18n：静态部分用 data-i18n 标出，紧随其后的脚本在解析期同步替换（首帧前完成，
       与 <head> 里主题/语言的初始化同一时机），因此不会出现中文先亮再变英文的闪烁。
       标签内保留中文作为 i18n 不可用时的兜底显示。 -->
  <div id="boot-splash" role="status" aria-live="polite">
    <div class="bs-mark" aria-hidden="true">
      <svg viewBox="26 56 460 400" xmlns="http://www.w3.org/2000/svg">
        <!-- 辉光副本（垫在主线下面）：同路径、加宽描边 + CSS blur，低不透明度 -->
        <path class="bs-hex-glow" pathLength="1" opacity="0.26"
              d="M 480.00 256.00 L 368.00 449.99 L 144.00 449.99 L 32.00 256.00 L 144.00 62.01 L 368.00 62.01 Z"
              fill="none" stroke="#2EE6B3" stroke-width="24" stroke-linejoin="round"/>
        <path class="bs-hex" pathLength="1"
              d="M 480.00 256.00 L 368.00 449.99 L 144.00 449.99 L 32.00 256.00 L 144.00 62.01 L 368.00 62.01 Z"
              fill="#0F1E28" stroke="#2EE6B3" stroke-width="10" stroke-linejoin="round"/>
        <!-- 波形辉光必须画在六边形"实心底"之上，否则会被这块不透明底完全盖住（A/B 像素差分实测过） -->
        <path class="bs-wave-glow" pathLength="1" opacity="0.24"
              d="M 108.00 256.00 L 196.80 256.00 L 249.00 118.00 L 263.00 406.00 L 315.20 256.00 L 404.00 256.00"
              fill="none" stroke="#2EE6B3" stroke-width="30"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path class="bs-wave" pathLength="1"
              d="M 108.00 256.00 L 196.80 256.00 L 249.00 118.00 L 263.00 406.00 L 315.20 256.00 L 404.00 256.00"
              fill="none" stroke="#2EE6B3" stroke-width="15"
              stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 描边流光：单次高光扫过 -->
        <path class="bs-hex-streak" pathLength="1"
              d="M 480.00 256.00 L 368.00 449.99 L 144.00 449.99 L 32.00 256.00 L 144.00 62.01 L 368.00 62.01 Z"
              fill="none" stroke="#A8F5DA" stroke-width="12" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="bs-wordmark" aria-label="DigitalLab"><span>D</span><span>i</span><span>g</span><span>i</span><span>t</span><span>a</span><span>l</span><span>L</span><span>a</span><span>b</span></div>
    <section class="bs-checks">
      <div class="bs-checks-title" data-i18n="boot.selfCheck">启动自检</div>
      <div class="bs-item" id="bs-check-backend"><span class="bs-dot"></span><span class="bs-name" data-i18n="boot.item.backend">后端已启动</span><span class="bs-state" data-i18n="boot.state.wait">等待中</span></div>
      <div class="bs-item" id="bs-check-collector"><span class="bs-dot"></span><span class="bs-name" data-i18n="boot.item.collector">采集器运行</span><span class="bs-state" data-i18n="boot.state.wait">等待中</span></div>
      <div class="bs-item" id="bs-check-hardware"><span class="bs-dot"></span><span class="bs-name" data-i18n="boot.item.hardware">硬件就绪</span><span class="bs-state" data-i18n="boot.state.wait">等待中</span></div>
      <div class="bs-item" id="bs-check-nas"><span class="bs-dot"></span><span class="bs-name" data-i18n="boot.item.nas">NAS 连接</span><span class="bs-state" data-i18n="boot.state.wait">等待中</span></div>
    </section>
  </div>
  <script>
    // 开屏覆盖层静态文案替换：解析到这里就同步跑完（首帧前），语言来自 <head> 里已定好的 i18n 实例。
    (function () {
      var I = window.DigitalLabI18n;
      if (!I || typeof I.t !== 'function') return;
      var root = document.getElementById('boot-splash');
      if (!root) return;
      var nodes = root.querySelectorAll('[data-i18n]');
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].textContent = I.t(nodes[i].getAttribute('data-i18n'));
      }
    })();
  </script>

  <!-- ── 首次启动引导覆盖层 ──
       显示条件：应用级 config.json 的 onboarding_done 不为 true（由外壳在 'splash-finished' 后判定）。
       文案全部由脚本按当前语言填充（data-ob / data-ob-ph 标出 key），切换语言时整体重填，不会串语言。
       第 2 步的设备字段与占位符复用 set.dev.* 词典 key，不重复定义。 -->
  <div id="onboarding" role="dialog" aria-modal="true" aria-labelledby="ob-title">
    <div class="ob-card">
      <div class="ob-title" id="ob-title" data-ob="onboard.title"></div>
      <div class="ob-sub" data-ob="onboard.sub"></div>
      <div class="ob-steps" id="ob-steps"></div>

      <div class="ob-pane" data-pane="1">
        <div class="ob-pane-title" data-ob="onboard.lang.title"></div>
        <div class="ob-pane-hint" data-ob="onboard.lang.hint"></div>
        <div class="ob-langs" id="ob-langs"></div>
      </div>

      <div class="ob-pane" data-pane="2">
        <div class="ob-pane-title" data-ob="onboard.dev.title"></div>
        <div class="ob-pane-hint" data-ob="onboard.dev.hint"></div>
        <div class="ob-form">
          <div class="ob-row"><label data-ob="set.dev.name"></label><input type="text" id="ob-dev-name" data-ob-ph="set.dev.namePh" /></div>
          <div class="ob-row"><label data-ob="set.dev.host"></label><input type="text" id="ob-dev-host" data-ob-ph="set.dev.hostPh" /></div>
          <div class="ob-row"><label data-ob="set.dev.port"></label><input type="number" id="ob-dev-port" value="22" /></div>
          <div class="ob-row"><label data-ob="set.dev.username"></label><input type="text" id="ob-dev-user" data-ob-ph="set.dev.userPh" /></div>
          <div class="ob-row"><label data-ob="set.dev.password"></label><input type="password" id="ob-dev-pass" data-ob-ph="set.dev.passPh" /></div>
        </div>
        <div class="ob-msg" id="ob-dev-msg"></div>
      </div>

      <div class="ob-pane" data-pane="3">
        <div class="ob-pane-title" data-ob="onboard.check.title"></div>
        <div class="ob-status" id="ob-status"></div>
        <div class="ob-msg" id="ob-check-msg"></div>
        <button class="ob-btn ob-ghost ob-later" id="ob-later-3" data-ob="onboard.btn.later"></button>
      </div>

      <div class="ob-foot">
        <button class="ob-btn ob-ghost" id="ob-later" data-ob="onboard.btn.later"></button>
        <button class="ob-btn ob-ghost" id="ob-back" data-ob="onboard.btn.back"></button>
        <span class="ob-spacer"></span>
        <button class="ob-btn ob-secondary" id="ob-retry" data-ob="onboard.check.retry"></button>
        <button class="ob-btn ob-primary" id="ob-next" data-ob="onboard.btn.next"></button>
      </div>
    </div>
  </div>
  <script>
    // 首次启动引导：三步（选语言 / 配设备 / 查连接）。
    // 只依赖 <head> 的 i18n 与 preload 暴露的 API，不碰 styles.css、不改任何面板。
    (function () {
      'use strict';
      var root = document.getElementById('onboarding');
      if (!root) return;
      var api = window.digitalLab;

      var T = function (key, params) {
        return (window.DigitalLabI18n && window.DigitalLabI18n.t) ? window.DigitalLabI18n.t(key, params) : key;
      };
      // 后端错误对象/字符串转文案（与 settings.js / terminal.js 同一套双兼容规则）
      function backendErrorText(obj) {
        if (!obj) return '';
        var err = (obj.error !== undefined) ? obj.error : null;
        if (err && typeof err === 'object' && err.code) return T(err.code, err.params || {}) || String(err.code);
        if (typeof err === 'string' && err) return err;
        if (obj.code) return T(obj.code, obj.params || {}) || String(obj.code);
        if (typeof obj.message === 'string' && obj.message) return obj.message;
        return '';
      }

      var el = {
        steps: root.querySelector('#ob-steps'),
        langs: root.querySelector('#ob-langs'),
        panes: root.querySelectorAll('.ob-pane'),
        devName: root.querySelector('#ob-dev-name'),
        devHost: root.querySelector('#ob-dev-host'),
        devPort: root.querySelector('#ob-dev-port'),
        devUser: root.querySelector('#ob-dev-user'),
        devPass: root.querySelector('#ob-dev-pass'),
        devMsg: root.querySelector('#ob-dev-msg'),
        status: root.querySelector('#ob-status'),
        checkMsg: root.querySelector('#ob-check-msg'),
        later: root.querySelector('#ob-later'),
        later3: root.querySelector('#ob-later-3'),
        back: root.querySelector('#ob-back'),
        retry: root.querySelector('#ob-retry'),
        next: root.querySelector('#ob-next')
      };

      var STEP_KEYS = ['onboard.step.language', 'onboard.step.device', 'onboard.step.check'];
      var step = 1;
      var opened = false;       // 幂等：splash-finished 可能被派发两次
      var finished = false;
      var busy = false;
      var device = null;        // 第 2 步保存下来的设备记录
      var savedAt = 0;          // 保存时刻：只认这之后采集到的新状态，避免旧设备残留的 online=true 被当成通过
      var testOk = false;       // 一次测试是否 ok
      var onlineSeen = false;   // 状态帧里该设备是否 online（且是保存之后的新数据）
      var unsubState = null;
      var waitTimer = null;

      // ── 文案：所有带 data-ob / data-ob-ph 的节点按当前语言重填 ──
      function applyTexts() {
        var i, n;
        var nodes = root.querySelectorAll('[data-ob]');
        for (i = 0; i < nodes.length; i++) {
          n = nodes[i];
          n.textContent = T(n.getAttribute('data-ob'));
        }
        var phs = root.querySelectorAll('[data-ob-ph]');
        for (i = 0; i < phs.length; i++) {
          n = phs[i];
          n.setAttribute('placeholder', T(n.getAttribute('data-ob-ph')));
        }
        root.setAttribute('aria-label', T('onboard.title'));
        renderSteps();
        renderLangs();
        renderFoot();
        updateStatus();
      }

      function renderSteps() {
        var html = '';
        for (var i = 0; i < STEP_KEYS.length; i++) {
          var cls = 'ob-chip' + (step === i + 1 ? ' is-active' : (step > i + 1 ? ' is-done' : ''));
          html += '<span class="' + cls + '">' + (i + 1) + '. ' + T(STEP_KEYS[i]) + '</span>';
        }
        el.steps.innerHTML = html;
      }

      // ── 第 1 步：语言（清单来自 DigitalLabLocales.LANGUAGES，不写死）──
      function renderLangs() {
        var L = (window.DigitalLabLocales && window.DigitalLabLocales.LANGUAGES) || [];
        var cur = (window.DigitalLabI18n && window.DigitalLabI18n.getLanguage) ? window.DigitalLabI18n.getLanguage() : '';
        var html = '';
        for (var i = 0; i < L.length; i++) {
          var active = (L[i].code === cur);
          html += '<button class="ob-lang' + (active ? ' is-active' : '') + '" data-code="' + L[i].code + '">' +
                  '<span>' + (L[i].nativeName || L[i].name || L[i].code) + '</span>' +
                  '<span class="ob-lang-tick">' + (active ? '\u2713' : '') + '</span></button>';
        }
        el.langs.innerHTML = html;
        var btns = el.langs.querySelectorAll('.ob-lang');
        for (var k = 0; k < btns.length; k++) {
          btns[k].addEventListener('click', function () { switchLanguage(this.getAttribute('data-code')); });
        }
      }

      // 复用设置面板那 5 步：i18n 切换 → localStorage → html lang → 主进程 → language-changed
      function switchLanguage(code) {
        var I = window.DigitalLabI18n;
        if (!I || typeof I.setLanguage !== 'function') return;
        if (!I.setLanguage(code)) return;
        try { localStorage.setItem('digitallab-lang', code); } catch (e) {}
        document.documentElement.setAttribute('lang', code);
        try { if (api && typeof api.setLanguage === 'function') api.setLanguage(code); } catch (e) {}
        window.dispatchEvent(new CustomEvent('language-changed', { detail: code }));
      }

      function renderFoot() {
        el.later.style.display = (step === 1) ? '' : 'none';
        el.back.style.display = (step === 1) ? 'none' : '';
        el.retry.style.display = (step === 3) ? '' : 'none';
        el.later3.style.display = (step === 3) ? '' : 'none';
        el.next.textContent = T(step === 3 ? 'onboard.btn.finish' : 'onboard.btn.next');
        el.next.disabled = busy || (step === 3 && !isPassed());
        el.retry.disabled = busy;
      }

      function setPane() {
        for (var i = 0; i < el.panes.length; i++) {
          el.panes[i].classList.toggle('is-active', Number(el.panes[i].getAttribute('data-pane')) === step);
        }
      }

      function setMsg(node, text, kind) {
        node.textContent = text || '';
        node.classList.remove('is-error', 'is-ok');
        if (kind) node.classList.add(kind);
      }

      function isPassed() { return !!(testOk && onlineSeen); }

      // ── 第 3 步状态行：未通过时分两行（连接测试 / 设备在线），通过后合成一句 ──
      function statusLine(on, fail, text) {
        return '<div class="ob-status-line"><span class="ob-status-dot' + (on ? (fail ? ' is-fail' : ' is-ok') : '') + '">\u25CF</span><span>' + text + '</span></div>';
      }

      function updateStatus() {
        if (!el.status) return;
        if (step !== 3 || !device) { el.status.innerHTML = ''; return; }
        if (isPassed()) { el.status.innerHTML = statusLine(true, false, T('onboard.check.pass')); return; }
        var html = statusLine(testOk, !testOk, testOk ? T('onboard.check.testPass') : T('onboard.check.fail'));
        html += statusLine(onlineSeen, false, onlineSeen ? T('onboard.check.online') : T('onboard.check.waiting'));
        el.status.innerHTML = html;
      }

      // ── 第 2 步：保存设备（只做新增；同名则覆盖，避免重复）──
      function collectDevice() {
        return {
          name: (el.devName.value || '').trim(),
          host: (el.devHost.value || '').trim(),
          port: parseInt(el.devPort.value, 10) || 22,
          username: (el.devUser.value || '').trim(),
          password: el.devPass.value || ''
        };
      }

      async function saveDevice() {
        var rec = collectDevice();
        if (!rec.name || !rec.host) { setMsg(el.devMsg, T('onboard.dev.needFields'), 'is-error'); return false; }
        busy = true; setMsg(el.devMsg, T('onboard.dev.saving'), ''); renderFoot();
        try {
          var cfg = await api.getConfig();
          if (!cfg || typeof cfg !== 'object') cfg = {};
          if (!Array.isArray(cfg.nas_devices)) cfg.nas_devices = [];
          var idx = -1;
          for (var i = 0; i < cfg.nas_devices.length; i++) {
            if (cfg.nas_devices[i] && cfg.nas_devices[i].name === rec.name) { idx = i; break; }
          }
          if (idx >= 0) cfg.nas_devices[idx] = rec; else cfg.nas_devices.push(rec);
          var r = await api.saveConfig(cfg);
          if (r && r.ok === false) {
            setMsg(el.devMsg, T('common.saveFailed', { message: backendErrorText(r) || T('common.unknownError') }), 'is-error');
            busy = false; renderFoot(); return false;
          }
          // 让后端重启 NAS 采集线程，新设备才会出现在状态帧里
          try { await api.sendCommand({ cmd: 'reload_config' }); } catch (e) {}
          device = rec;
          savedAt = Date.now();   // 之后的状态帧才算"这台设备的新数据"
          setMsg(el.devMsg, '', '');
          busy = false; renderFoot();
          return true;
        } catch (e) {
          setMsg(el.devMsg, T('common.saveFailed', { message: e.message }), 'is-error');
          busy = false; renderFoot();
          return false;
        }
      }

      // ── 第 3 步：测试连接 + 等设备上线 ──
      function subscribeState() {
        if (unsubState || !api || typeof api.onStateUpdate !== 'function') return;
        try {
          unsubState = api.onStateUpdate(function (state) {
            if (!device || !state || !state.nas) return;
            var d = state.nas[device.name];
            if (!d || d.online !== true) return;
            // 只认"保存/测试之后"采集到的新数据：
            // 同名设备在改动主机前可能还留着上一轮的 online=true 与 last_updated，
            // 若直接采信，改成一个连不上的地址也会被判成通过。
            if (d.last_updated) {
              var lu = Date.parse(d.last_updated);
              if (!isNaN(lu) && lu < savedAt - 3000) return;
            }
            if (!onlineSeen) {
              onlineSeen = true;
              renderFoot(); updateStatus();
            }
          });
        } catch (e) {}
      }

      function startWait() {
        if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
        waitTimer = setTimeout(function () {
          waitTimer = null;
          if (!onlineSeen && step === 3) {
            setMsg(el.checkMsg, T('onboard.check.timeout'), '');
            updateStatus();
          }
        }, 15000);
      }

      async function runTest() {
        if (!device) return;
        busy = true; testOk = false; onlineSeen = false;
        setMsg(el.checkMsg, T('onboard.check.testing'), '');
        renderFoot(); updateStatus();
        subscribeState();
        try {
          var res = await api.sendCommand({ cmd: 'test_nas_connection', device: device });
          testOk = !!(res && res.ok === true);
          if (!testOk) {
            var detail = backendErrorText(res);
            setMsg(el.checkMsg, detail || T('set.dev.connFailed'), 'is-error');
          } else {
            setMsg(el.checkMsg, '', '');   // 通过后由状态行表达"等待上线"，避免重复
          }
        } catch (e) {
          testOk = false;
          setMsg(el.checkMsg, T('net.connectFailed', { detail: e.message }), 'is-error');
        }
        busy = false; renderFoot(); updateStatus();
        if (!onlineSeen) startWait();
      }

      // ── 流程控制 ──
      function goStep(n) {
        step = Math.min(3, Math.max(1, n));
        setPane(); renderSteps(); renderFoot(); updateStatus();
        if (step === 3 && device) runTest();
      }

      async function next() {
        if (busy) return;
        if (step === 1) { goStep(2); return; }
        if (step === 2) {
          var okSave = await saveDevice();
          if (okSave) goStep(3);
          return;
        }
        finish();   // 第 3 步：完成（仅在通过时可用）
      }

      function cleanup() {
        if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
        if (unsubState) { try { unsubState(); } catch (e) {} unsubState = null; }
      }

      function close() {
        opened = false;
        root.classList.remove('is-open');
        cleanup();
      }

      // 完成 / 稍后配置：都写入 onboarding_done=true（"稍后配置"表示用户已看过引导、明确选择稍后手动配置，
      // 否则每次启动都会再弹一次），随后关闭覆盖层。
      function finish() {
        if (finished) return;
        finished = true;
        try { if (api && typeof api.setOnboardingDone === 'function') api.setOnboardingDone(true); } catch (e) {}
        close();
      }

      // 外壳在 'splash-finished' 后调用；幂等
      function openIfNeeded() {
        if (opened) return;
        var done = false;
        try { done = !!(api && typeof api.getOnboardingDoneSync === 'function' && api.getOnboardingDoneSync()); } catch (e) {}
        if (done) return;
        open();
      }

      function open() {
        opened = true;
        finished = false;
        step = 1;
        device = null; testOk = false; onlineSeen = false;
        setMsg(el.devMsg, '', ''); setMsg(el.checkMsg, '', '');
        applyTexts();
        setPane();
        root.classList.add('is-open');
        try { el.devName.focus(); } catch (e) {}
      }

      el.next.addEventListener('click', next);
      el.back.addEventListener('click', function () { goStep(step - 1); });
      el.retry.addEventListener('click', function () { runTest(); });
      el.later.addEventListener('click', finish);
      el.later3.addEventListener('click', finish);
      root.addEventListener('keydown', function (e) { if (e.key === 'Escape') finish(); });

      // 语言切换（无论来自引导本身还是设置面板）→ 重填文案
      window.addEventListener('language-changed', function () { if (opened) applyTexts(); });

      // 供外壳与设置面板调用（设置面板的"重新运行引导"）
      window.DigitalLabOnboarding = {
        openIfNeeded: openIfNeeded,
        open: open,
        close: close,
        isOpen: function () { return opened; }
      };

      applyTexts();   // 先把文案填好（此时仍隐藏）
    })();
  </script>
  <script>
    // 启动自检：真实状态驱动 + 固定节奏逐项点亮 + 超时兜底 + 淡出
    (function () {
      var root = document.getElementById('boot-splash');
      if (!root) return;
      // ── 开屏开关（应用级 config.json 的 splash_animation，默认开）──
      // 启动期同步读取（sendSync，一次）；关掉时直接移除覆盖层并短路，不装任何监听、不起跑动画。
      var splashEnabled = true;
      try {
        var bootApi = window.digitalLab;
        if (bootApi && typeof bootApi.getSplashAnimationSync === 'function') {
          splashEnabled = bootApi.getSplashAnimationSync() !== false;
        }
      } catch (e) {}
      if (!splashEnabled) {
        if (root.parentNode) root.parentNode.removeChild(root);
        // 开屏被关闭时没有淡出动画，这里必须派发同一个结束事件，
        // 否则"关掉开屏动画"的用户永远等不到引导（勘察报告里点出的最易漏分支）。
        // 注意：这个分支发生在解析期，外壳的监听还没装上，所以同时留一个标记，
        // 由外壳在注册监听后补查一次（见模块脚本里的 __splashFinished 判断）。
        window.__splashFinished = true;
        try { window.dispatchEvent(new CustomEvent('splash-finished')); } catch (e) {}
        return;
      }
      var SCRIPT_T0 = performance.now();   // 脚本起跑（探针与 10s 超时兜底的基准）
      var t0 = 0;                          // JS 时间线基准：判定"窗口可见"那一刻才赋值
      var KEYS = ['backend', 'collector', 'hardware', 'nas'];
      var REVEAL_AT = [2600, 3000, 3400, 3800];   // 第 1..4 项点亮时刻（相对页面加载，ms）
      var DEADLINE_MS = 10000;                    // 超时兜底
      var FINAL = { pass: 1, fail: 1, skip: 1 };
      // 覆盖层文案一律取 i18n（语言在 <head> 已定好，这里只是按当前语言取字符串）
      var I18N = window.DigitalLabI18n;
      var T = function (key, params) {
        return (I18N && typeof I18N.t === 'function') ? I18N.t(key, params) : key;
      };
      var LABEL = {
        wait: T('boot.state.wait'), pass: T('boot.state.pass'),
        fail: T('boot.state.fail'), skip: T('boot.state.skip')
      };
      var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
      var reduced = !!(mq && mq.matches);

      var items = {};
      KEYS.forEach(function (k) {
        items[k] = { el: document.getElementById('bs-check-' + k), state: 'wait', detail: '', shown: false };
      });

      var shownCount = 0, resolvedCount = 0, faded = false;

      function render(it) {
        if (!it.el) return;
        var st = it.el.querySelector('.bs-state');
        st.textContent = it.detail ? LABEL[it.state] + ' · ' + it.detail : LABEL[it.state];
        // 用 classList 增删，不要整串重写 className：否则每来一帧状态都会把 is-pop 抹掉，
        // 点亮反馈（光晕/位移）会在动画播到一半时被取消（实测取证见开发日志）。
        it.el.classList.toggle('is-shown', !!it.shown);
        it.el.classList.remove('st-wait', 'st-pass', 'st-fail', 'st-skip');
        it.el.classList.add('st-' + it.state);
      }

      function pop(it) {
        if (!it.el) return;
        it.el.classList.remove('is-pop');
        void it.el.offsetWidth;      // 触发重排，重放动画
        it.el.classList.add('is-pop');
      }

      function setState(k, state, detail) {
        var it = items[k];
        if (!it) return;
        var wasFinal = !!FINAL[it.state];
        it.state = state;
        it.detail = detail || '';
        render(it);
        if (!wasFinal && FINAL[state]) {
          resolvedCount++;
          pop(it);
          maybeFinish();
        }
      }

      function reveal(k) {
        var it = items[k];
        if (!it || it.shown) return;
        it.shown = true;
        render(it);
        shownCount++;
        if (FINAL[it.state]) pop(it);   // 数据早已就绪时，点亮这一刻补一次脉冲，用户能看到它"亮"起来
        maybeFinish();
      }

      function doFade() {
        if (faded) return;
        faded = true;
        root.classList.add('is-out');
        var done = function () {
          root.style.display = 'none';
          // 开屏真正结束（淡出动画结束或兜底超时）才派发：引导页据此决定是否显示。
          // 可能被调用两次（animationend + 超时兜底），监听方需要自己做幂等。
          window.__splashFinished = true;
          try { window.dispatchEvent(new CustomEvent('splash-finished')); } catch (e) {}
        };
        root.addEventListener('animationend', function (ev) {
          if (ev.animationName === 'bs-splashOut') done();   // 只认淡出动画，忽略呼吸/其它动画的结束
        });
        setTimeout(done, reduced ? 400 : 1200);   // 兜底：reduced-motion 下没有动画事件
      }

      function maybeFinish() {
        if (faded) return;
        if (shownCount < KEYS.length || resolvedCount < KEYS.length) return;
        if (!reduced) root.classList.add('is-breath');   // 收尾呼吸：与 400ms 停留同步，随后淡出
        setTimeout(doFade, reduced ? 800 : 400);   // 全部展示完后再停留一下，保证每项都看得清
      }

      // ── 真实状态判定 ──
      var seenFrame = false;
      function onState(state) {
        if (!state || typeof state !== 'object') return;
        if (!seenFrame) { seenFrame = true; setState('backend', 'pass', T('boot.detail.frame')); }

        var m = state.monitor || {};
        var cpu = typeof m.cpu === 'number' ? m.cpu : 0;
        if (cpu > 0) setState('collector', 'pass', 'CPU ' + cpu.toFixed(1) + '%');

        var hw = state.hardware, hwCount = 0;
        if (hw) hwCount = Array.isArray(hw) ? hw.length : Object.keys(hw).length;
        if (hwCount > 0) setState('hardware', 'pass', T('boot.detail.hardwareCount', { count: hwCount }));

        if (Object.prototype.hasOwnProperty.call(state, 'nas')) {
          var nas = state.nas || {}, names = Object.keys(nas);
          var online = names.filter(function (n) { return nas[n] && nas[n].online === true; }).length;
          setState('nas', 'pass', online
            ? T('boot.detail.nasOnline', { count: online })
            : (names.length ? T('boot.detail.nasNoneOnline') : T('boot.detail.nasUnconfigured')));
        } else {
          setState('nas', 'skip', T('boot.detail.nasNoState'));
        }
      }

      var api = window.digitalLab;
      if (api && typeof api.onStateUpdate === 'function') {
        try { api.onStateUpdate(onState); } catch (e) {}
      } else {
        KEYS.forEach(function (k) { setState(k, 'fail', T('boot.detail.preloadDown')); });
      }

      // ── 起跑判定：等"合成器真正开始出帧"的那一帧，而不是窗口一显示就起跑 ──
      // 诊断实测：show() 之后合成器还要 300~340ms 才恢复出帧（这期间窗口只有 Electron 底色），
      // 而旧的 focus / rAF 三帧信号在 show 那一刻就触发，动画时钟随即开始跑，
      // 用户看到内容时六边形已经画掉一段（动画"抢跑"）。
      // 现在改成盯 rAF 的"停摆-恢复"：连续超过 stallMs 没有 rAF 算停摆，恢复的那一帧才 arm。
      // 模式开关：ARM.mode = 'stall'（默认，停摆-恢复检测）| 'fixed'（备选，窗口显示后固定延时）。
      var ARM = {
        // 默认 stall。想切备选方案有两种办法：
        //   1) 直接把下面这行改成 mode: 'fixed'，重新打包；
        //   2) 不重新打包：在页面脚本之前设 window.__armModeWant = 'fixed'（调试/临时切换用）。
        mode: (window.__armModeWant === 'fixed' ? 'fixed' : 'stall'),
        stallMs: 150,       // 停摆判定阈值：连续多少毫秒没有 rAF 算停摆
        fixedMs: 1000,      // fixed 模式：窗口显示信号到达后延时多久 arm
        fallbackMs: 800,    // stall 模式硬兜底：窗口显示信号到达后最多再等多久就强制 arm
        safetyMs: 3000      // 兜底：窗口显示信号一直没出现时，首帧之后多久用它当锚点
      };

      var armed = false;
      function arm(reason) {
        if (armed) return;
        armed = true;
        t0 = performance.now();          // JS 时间线基准 = 判定可见这一刻
        root.classList.add('is-armed');  // CSS 动画从这一刻起跑（delay 重新计算）
        if (reduced) {
          // 减少动态效果：不提前显示，判定可见后一次性给出终态
          KEYS.forEach(function (k) { reveal(k); });
        } else {
          scheduleReveals();
        }
        maybeFinish();
      }

      // 逐项点亮对齐到"CSS 动画真正起跑"的那一刻。
      // 窗口刚显示时首帧开销（字体、模糊滤镜等）会让动画时钟比 is-armed 晚几十~几百毫秒，
      // 若直接把定时器挂在 arm 上，第一项可能在面板还没淡入时就点亮了。实测取证见开发日志。
      function scheduleReveals() {
        var hexEl = root.querySelector('.bs-hex');
        var anims = (hexEl && hexEl.getAnimations) ? hexEl.getAnimations() : [];
        var a = anims.length ? anims[0] : null;
        var pending = a && a.startTime === null;
        if (pending && performance.now() - t0 < 700) {   // 最多等 700ms，等不到就照常走
          requestAnimationFrame(scheduleReveals);
          return;
        }
        var offset = (a && a.startTime !== null) ? Math.max(0, a.startTime - t0) : 0;
        var base = t0 + offset;   // 目标绝对时刻（与 CSS 动画同一把尺子），不受本函数被调用的早晚影响
        KEYS.forEach(function (k, i) {
          setTimeout(function () { reveal(k); }, Math.max(0, base + REVEAL_AT[i] - performance.now()));
        });
      }

      // ── 窗口显示锚点 + rAF 停摆-恢复检测 ──
      // 锚点只用来定"窗口已显示"这一刻（给硬兜底计时、给停摆-恢复做闸门），它本身不再触发起跑。
      // 硬锚点的正式来源是主进程 show() 之后发来的 'window-shown' IPC；
      // 软锚点（focus）可能在窗口真正显示之前就到达，只能当近似。
      var anchorAt = 0, anchorHard = false, anchorTimer = 0, firstFrameAt = 0, lastFrameAt = 0;

      function scheduleFallback() {
        if (anchorTimer) { clearTimeout(anchorTimer); anchorTimer = 0; }
        var delay = (ARM.mode === 'fixed') ? ARM.fixedMs : ARM.fallbackMs;
        anchorTimer = setTimeout(function () {
          arm((ARM.mode === 'fixed' ? 'fixed' : 'fallback') + delay);
        }, delay);
      }

      // 锚点登记：记下硬/软锚点并（重新）安排兜底定时器。硬锚点只能被第一个硬锚点占据，
      // 所以 IPC 只认最先到的那一次。
      function anchor(why, hard) {
        hard = !!hard;
        if (anchorHard) { return; }              // 已经有准确锚点，不再改
        if (anchorAt && !hard) { return; }       // 软锚点不重复设；硬锚点可以覆盖软锚点并重新计时
        anchorAt = performance.now();
        anchorHard = hard;
        scheduleFallback();
      }

      // 锚点来源 1（硬，正式接口）：主进程 show() 之后发来的 'window-shown' IPC
      if (api && typeof api.onWindowShown === 'function') {
        try { api.onWindowShown(function () { anchor('ipc', true); }); } catch (e) {}
      }
      // 锚点来源 2（软）：窗口获得焦点
      window.addEventListener('focus', function () { anchor('focus', false); });

      function frameWatch(ts) {
        if (armed) return;
        var now = (typeof ts === 'number') ? ts : performance.now();
        if (!firstFrameAt) {
          firstFrameAt = now;
          // 锚点来源 3（软，最深兜底）：IPC 与 focus 都没有时，首帧之后用 safetyMs 兜一下
          setTimeout(function () { anchor('safety', false); }, ARM.safetyMs);
        }
        if (lastFrameAt) {
          var gap = now - lastFrameAt;
          if (gap > ARM.stallMs) {
            lastFrameAt = now;
            // 只在"确实已 show"（硬锚点）之后才认这次恢复：
            // 否则可能是加载期的空档（字体/首绘），认了就等于又抢跑一次。
            if (ARM.mode === 'stall' && anchorHard) { arm('stallResume'); return; }
          }
        }
        lastFrameAt = now;
        if (typeof requestAnimationFrame === 'function') { requestAnimationFrame(frameWatch); }
      }
      // 起跑前一直盯着帧（这段监测本身很轻：一帧一次比较，arm 之后立即退出）
      if (typeof requestAnimationFrame === 'function') { requestAnimationFrame(frameWatch); }

      // ── 超时兜底：10s 仍未完成的项目标红"失败"，覆盖层照常淡出 ──
      setTimeout(function () {
        if (!armed) arm('deadline');     // 兜底：直到此时还没判定过可见，也强制起跑
        KEYS.forEach(function (k) {
          var it = items[k];
          if (!it || !it.el) return;
          if (!it.shown) { it.shown = true; render(it); shownCount++; }
          if (!FINAL[it.state]) setState(k, 'fail', T('boot.detail.timeout'));
        });
        maybeFinish();
      }, Math.max(0, DEADLINE_MS - (performance.now() - SCRIPT_T0)));
    })();
  </script>

  <script type="module">
    import { PANELS, getPanelById, getPanelName } from './panels/index.js';

    // 外壳自己的文案也走 i18n（词典与 t() 由 <head> 里的 i18n.js 提供）
    const T = (key, params) => (
      (typeof window !== 'undefined' && window.DigitalLabI18n)
        ? window.DigitalLabI18n.t(key, params)
        : key
    );

    const api = window.digitalLab;
    if (!api) {
      document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#f43f5e;font-size:16px;font-family:system-ui,sans-serif;background:#0f1419">${T('boot.fail.preload')}</div>`;
      throw new Error('window.digitalLab not available');
    }
    let currentPanelId = null;
    let currentCleanup = null;

    // Build sidebar navigation（面板名走 i18n，语言切换时整块重建）
    const nav = document.getElementById('sidebar-nav');
    function buildNav() {
      nav.innerHTML = '';
      PANELS.forEach(panel => {
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.dataset.panelId = panel.id;
        // 终端默认禁用，等首次状态更新确认有在线 NAS 后再启用
        if (panel.id === 'terminal') {
          item.classList.add('disabled');
          item.title = T('nav.hint.terminalNoNas');
        }
        item.innerHTML = `<span class="nav-icon">${panel.icon}</span>${getPanelName(panel.id)}`;
        item.addEventListener('click', () => {
          if (item.classList.contains('disabled')) {
            if (panel.id === 'terminal') {
              const toast = document.createElement('div');
              toast.className = 'nav-toast';
              toast.textContent = T('nav.hint.terminalNoNas');
              item.appendChild(toast);
              setTimeout(() => toast.remove(), 2000);
            }
            return;
          }
          switchPanel(panel.id);
        });
        nav.appendChild(item);
      });
    }
    buildNav();

    // Terminal nav item: disable when no online NAS
    api.onStateUpdate((state) => {
      const terminalItem = nav.querySelector('[data-panel-id="terminal"]');
      if (!terminalItem) return;
      const nas = state.nas || {};
      const hasOnline = Object.values(nas).some(d => d.online === true);
      if (hasOnline) {
        terminalItem.classList.remove('disabled');
        terminalItem.title = '';
      } else {
        terminalItem.classList.add('disabled');
        terminalItem.title = T('nav.hint.terminalNoNas');
      }
    });

    async function switchPanel(id) {
      if (id === currentPanelId) return;

      // Cleanup previous panel
      if (currentCleanup) {
        try { currentCleanup(); } catch (e) {}
        currentCleanup = null;
      }

      // Update nav highlight
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const navItem = document.querySelector(`[data-panel-id="${id}"]`);
      if (navItem) navItem.classList.add('active');

      // Render panel
      const main = document.getElementById('main-content');
      const panel = getPanelById(id);
      if (!panel) return;

      // Clear and create container
      main.innerHTML = '';
      const container = document.createElement('div');
      container.className = 'panel active';
      container.id = `panel-${id}`;
      main.appendChild(container);

      try {
        currentCleanup = await panel.init(container, api);
        currentPanelId = id;
      } catch (e) {
        console.error(`Failed to init panel ${id}:`, e);
        container.innerHTML = `<div style="text-align:center;padding:40px;color:var(--text-tertiary)">${T('boot.fail.panel')}</div>`;
      }
    }

    // Default: activate dashboard
    switchPanel('dashboard');

    // 跨面板导航（AI 设置按钮等）
    window.addEventListener('switch-panel', (e) => {
      switchPanel(e.detail);
    });

    // 首次启动引导：开屏结束（含"开屏动画已关闭"的分支）后判定一次。
    // 读取标志与显示覆盖层都在引导模块里，这里只负责触发，避免两处判定条件。
    function maybeOpenOnboarding() {
      try {
        if (window.DigitalLabOnboarding && typeof window.DigitalLabOnboarding.openIfNeeded === 'function') {
          window.DigitalLabOnboarding.openIfNeeded();
        }
      } catch (e) {}
    }
    window.addEventListener('splash-finished', maybeOpenOnboarding);
    // 开屏被关闭时事件发生在解析期（早于本监听注册），用标记补一次判定
    if (window.__splashFinished) maybeOpenOnboarding();

    // 语言切换：重建侧栏文案，并重刷当前面板（面板内容每次都是整块重建，重跑一次 init 即可）
    window.addEventListener('language-changed', () => {
      buildNav();
      const id = currentPanelId;
      setTimeout(() => {
        currentPanelId = null;   // 绕开 switchPanel 的同名守卫，强制重新 init
        switchPanel(id);
      }, 0);
    });
  </script>
